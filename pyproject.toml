[project]
name = "gguf-jax"
version = "0.1.0"
description = "Load GGUF-quantized models in JAX and dequantize on the fly, bitwise-exact vs the llama.cpp reference"
readme = "README.md"
authors = [
    { name = "Emily Shepperd", email = "nshepperd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gguf>=0.19.0",
    "jax>=0.11.0",
    "numpy>=2.5.1",
    "cutejax @ git+https://github.com/nshepperd/cutejax",
    "jax-tvm-ffi>=0.1.3",
    "nvidia-cutlass-dsl>=4.7.0",
]

# The CuTe DSL's cu13 runtime libraries sit behind an extra (the cu12 ones are
# an unconditional requirement of the wheel, so there is no cu12 extra to
# mirror). The fused Q4_K kernels need whichever matches the CUDA build of the
# installed jax. Neither this package nor cutejax picks one -- both install
# against either -- so the choice is forwarded to the end-user project as
# gguf-jax[cu13].
#
# Without it the kernels still *import*, and every quantized matmul silently
# falls back to dequantizing whole weight tensors: on MiniMax Music 3 that is
# a 4.6 GB allocation for the LM, which OOMs a 16 GB card mid-generation.
[project.optional-dependencies]
cu13 = ["cutejax[cu13]"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "jax[cuda13]>=0.11.0",
    "nvidia-cutlass-dsl[cu13]>=4.7.0",
    "pytest>=9.1.1",
]

[tool.ty.environment]
# cutlass ships inside the nvidia-cutlass-dsl wheel and is put on sys.path at
# runtime by a .pth file, which ty does not execute.
extra-paths = [".venv/lib/python3.14/site-packages/nvidia_cutlass_dsl/dsl_packages"]

# The CuTe DSL's traced types (Integer, Numeric, cute layouts) support
# subscripting and bitwise ops at trace time without declaring them, so ty
# reports them against kernel code that is correct and GPU-tested.
[[tool.ty.overrides]]
include = ["src/gguf_jax/cute/**"]

[tool.ty.overrides.rules]
not-subscriptable = "ignore"
unsupported-operator = "ignore"
